name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pure vault-client tests (operations round-trip, deployment plan checks, fees, amounts).
      - run: npm test

      # tsc -b typecheck + vite production build.
      - run: npm run build
